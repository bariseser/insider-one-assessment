name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lint-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Verify Swagger docs are up to date
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make docs
          git diff --exit-code docs

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Vet
        run: go vet ./...

      - name: Test Unit
        run: go test ./... -race -coverprofile=coverage_unit.out -covermode=atomic -v

      - name: Detect integration tests
        id: integration
        shell: bash
        run: |
          if rg -l 'go:build integration|\+build integration' --glob '*.go' . >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test Integration
        if: steps.integration.outputs.exists == 'true'
        run: go test -tags integration ./... -race -coverprofile=coverage_integration.out -covermode=atomic -v

      - name: Merge coverage reports
        shell: bash
        run: |
          chmod +x scripts/merge-coverage.sh
          ./scripts/merge-coverage.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage_unit.out
            coverage_integration.out
          if-no-files-found: ignore

      - name: Detect SonarCloud configuration
        id: sonar
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ "${{ vars.SONAR_SCAN }}" == "true" && -n "$SONAR_TOKEN" && -n "${{ vars.SONAR_PROJECT_KEY }}" && -n "${{ vars.SONAR_ORGANIZATION }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud Scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.go.coverage.reportPaths=coverage.out
